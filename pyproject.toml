[project]
name = "enterprise-agent-command-center"
version = "3.0.0"
description = "Governed enterprise multi-agent orchestration reference implementation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
